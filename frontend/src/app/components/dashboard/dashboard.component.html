<div class="dashboard-container">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav 
                 mode="side" 
                 [opened]="sidenavOpened"
                 class="sidenav">
      <div class="sidenav-header">
        <div class="logo-small">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor"/>
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2"/>
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <h2 class="app-title">Chat Seguro</h2>
      </div>

      <mat-nav-list>
        <a mat-list-item routerLink="/chat" routerLinkActive="active">
          <mat-icon>chat</mat-icon>
          <span>Chat</span>
        </a>
        <a mat-list-item routerLink="/files" routerLinkActive="active">
          <mat-icon>folder</mat-icon>
          <span>Archivos</span>
        </a>
      </mat-nav-list>

      <div class="sidenav-footer">
        <div class="user-info">
          <mat-icon>account_circle</mat-icon>
          <span>{{ username }}</span>
        </div>
        <button mat-stroked-button (click)="logout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          Cerrar Sesión
        </button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <mat-toolbar class="toolbar">
        <button mat-icon-button (click)="toggleSidenav()" class="menu-button">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="toolbar-title">Sistema de Chat Seguro</span>
        <span class="spacer"></span>
        <div class="user-badge">
          <mat-icon>person</mat-icon>
          <span>{{ username }}</span>
        </div>
      </mat-toolbar>

      <div class="content-area">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
